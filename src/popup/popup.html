      <section id="view-settings" hidden>
        <div class="settings-row">
          <button class="nav-row settings-nav" id="toggle-default-ai" type="button" aria-expanded="false">

            <div id="default-ai" class="stack"></div>

            <div id="default-lang" class="chips"></div>
          </div>
        </div>

        <p class="caption">Screenshot shortcut: <span class="kbd">Alt</span> <span class="kbd">Shift</span> <span class="kbd">S</span></p>
        <div class="action-bar">
          <button class="btn btn-secondary" id="back-settings" type="button">Back</button>
        </div>
      </section>

      <section id="view-send" hidden>
        <div class="stepper" id="stepper"></div>
        <div class="meta" id="chip-row"></div>
        <p class="alert error" id="error"></p>

        <div id="step-ai">
          <h2 class="page-title">Choose an AI</h2>
          <div id="ai-list" class="stack"></div>
          <div class="action-bar">
            <button class="btn btn-secondary" id="back-ai" type="button">Back</button>
            <button class="btn btn-primary" id="continue-ai" type="button">Continue</button>
          </div>
        </div>

        <div id="step-action" hidden>
          <h2 class="page-title">Choose a task</h2>
          <div id="action-list" class="stack"></div>
          <div id="extra"></div>
          <p class="caption">
            Continuing transfers this content to the selected AI website and fills its composer. AskIt has no server; you click Send there.
          </p>
          <div class="action-bar">
            <button class="btn btn-secondary" id="back-action" type="button">Back</button>
            <button class="btn btn-primary" id="continue-action" type="button">Continue</button>
          </div>
        </div>

        <div id="step-status" hidden>
          <div class="prepare" id="prepare">
            <div class="spinner" aria-hidden="true"></div>
            <div class="status-icon" aria-hidden="true">
              <svg class="icon icon-xl si-ok" viewBox="0 0 256 256">

              </svg>
            </div>
            <p class="status-msg" id="status-text">Opening…</p>
            <img class="preview" id="fallback-img" alt="" hidden draggable="true" />
          </div>
          <div class="action-bar">
            <button class="btn btn-secondary" id="copy-image" type="button" hidden>Copy image</button>
            <button class="btn btn-secondary" id="back-status" type="button">Back</button>
          </div>
        </div>
      </section>
    </div>
